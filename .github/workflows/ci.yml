name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install sqlc
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz | tar xz -C /usr/local/bin sqlc
      - name: Lint, generated-code drift, race tests
        run: make check

  # docs/adr/0004: the contract only grows. Breaking changes against the base branch fail the PR.
  api-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base spec
        run: git show origin/${{ github.base_ref }}:api/openapi.yaml > /tmp/base.yaml
      - uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: /tmp/base.yaml
          revision: api/openapi.yaml
          fail-on: ERR
