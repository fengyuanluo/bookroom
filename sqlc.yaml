# sqlc generates internal/store/db from the goose migrations and internal/store/queries.
# Run `make generate` (or `sqlc generate`); never edit internal/store/db by hand.
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        emit_pointers_for_null_types: true
        emit_empty_slices: true
